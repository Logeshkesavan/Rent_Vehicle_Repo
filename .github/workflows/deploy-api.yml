
name: Deploy .NET API to MonsterASP

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        working-directory: Rent_Vehicle_API
        run: dotnet restore

      # 4️⃣ Publish as self-contained win-x64 (bundles runtime, no server dependency)
      - name: Publish
        working-directory: Rent_Vehicle_API
        run: >
          dotnet publish
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false

      # 5️⃣ Add web.config (InProcess + EXE for self-contained win-x64)
      - name: Add web.config
        run: |
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<configuration>' \
            '  <system.webServer>' \
            '    <handlers>' \
            '      <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />' \
            '    </handlers>' \
            '    <aspNetCore processPath=".\Rent_Vehicle_API.exe"' \
            '                stdoutLogEnabled="true"' \
            '                stdoutLogFile=".\logs\stdout"' \
            '                hostingModel="inprocess" />' \
            '  </system.webServer>' \
            '</configuration>' > Rent_Vehicle_API/publish/web.config

      # 6️⃣ Create app_offline.htm to gracefully stop site before upload
      - name: Create app_offline.htm
        run: echo "<h1>Deploying, please wait...</h1>" > Rent_Vehicle_API/publish/app_offline.htm

      # 7️⃣ Show publish output
      - name: Show publish output
        run: find Rent_Vehicle_API/publish -type f | head -30

      # 8️⃣ Upload app_offline.htm FIRST to unlock files on server
      - name: Upload app_offline to stop site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: site62384.siteasp.net
          username: site62384
          password: ${{ secrets.FTP_PASSWORD_API }}
          port: 21
          protocol: ftp
          local-dir: Rent_Vehicle_API/publish/
          server-dir: /wwwroot/
          include: app_offline.htm

      # 9️⃣ Wait for site to go offline
      - name: Wait for site to stop
        run: sleep 5

      # 🔟 Deploy full app
      - name: Deploy full app to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: site62384.siteasp.net
          username: ${{ secrets.FTP_USERNAME_API }}
          password: ${{ secrets.FTP_PASSWORD_API }}
          port: 21
          protocol: ftp
          local-dir: Rent_Vehicle_API/publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: true
          exclude: |
            app_offline.htm
