name: Deploy .NET API to MonsterASP

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # Change to your .NET version (6.0, 7.0, 8.0)

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        working-directory: Rent_Vehicle_API
        run: dotnet restore Rent_Vehicle.csproj

      # 4️⃣ Publish the project (framework-dependent, MonsterASP has .NET 8 runtime)
      - name: Publish
        working-directory: Rent_Vehicle_API
        run: dotnet publish Rent_Vehicle.csproj --configuration Release --no-self-contained --runtime win-x86 --output ./publish

      # 6️⃣ Show publish output (optional debug)
      - name: Show publish output
        run: find Rent_Vehicle_API/publish -type f | head -50

      # 7️⃣ Add web.config for .NET routing (MonsterASP requires this)
      - name: Add web.config
        run: |
          cat > Rent_Vehicle_API/publish/web.config << 'WEBCONFIG'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="aspNetCore" path="*" verb="*"
                     modules="AspNetCoreModuleV2"
                     resourceType="Unspecified" />
              </handlers>
              <aspNetCore processPath="dotnet"
                          arguments=".\Rent_Vehicle.dll"
                          stdoutLogEnabled="true"
                          stdoutLogFile=".\logs\stdout"
                          hostingModel="inprocess">
                <environmentVariables>
                  <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />
                  <environmentVariable name="ASPNETCORE_DETAILEDERRORS" value="true" />
                </environmentVariables>
              </aspNetCore>
            </system.webServer>
          </configuration>
          WEBCONFIG

      # 8️⃣ Take app offline so IIS releases DLL file locks
      - name: Take app offline
        run: |
          echo '<html><body><h2>Deployment in progress...</h2></body></html>' > app_offline.htm
          curl --ftp-create-dirs --silent --show-error \
            --user "${{ secrets.FTP_USERNAME_API }}:${{ secrets.FTP_PASSWORD_API }}" \
            -T app_offline.htm \
            "ftp://site62384.siteasp.net/wwwroot/app_offline.htm"

      - name: Wait for app pool to recycle
        run: sleep 15

      # 9️⃣ Deploy to MonsterASP via FTP
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: site62384.siteasp.net               # MonsterASP FTP host
          username: ${{ secrets.FTP_USERNAME_API }}
          password: ${{ secrets.FTP_PASSWORD_API }}
          port: 21
          protocol: ftp
          local-dir: Rent_Vehicle_API/publish/
          server-dir: /wwwroot/               # MonsterASP backend root
          dangerous-clean-slate: true
