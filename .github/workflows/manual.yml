name: Deploy Angular App via FTP

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: Rent_Vehicle_UI
        run: npm install

      - name: Build Angular app
        working-directory: Rent_Vehicle_UI
        run: npm run build -- --configuration production

      - name: Rename Angular CSR index file
        run: cp Rent_Vehicle_UI/dist/Rent_Vehicle_UI/browser/index.csr.html Rent_Vehicle_UI/dist/Rent_Vehicle_UI/browser/index.html

      - name: Show build output
        working-directory: Rent_Vehicle_UI
        run: ls -R dist

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: Rent_Vehicle_UI/dist/Rent_Vehicle_UI/browser/
          server-dir: /htdocs/
          dangerous-clean-slate: true
