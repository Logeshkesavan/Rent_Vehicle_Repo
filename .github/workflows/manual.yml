name: Deploy Angular App via FTP

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: Rent_Vehicle_UI
        run: npm install

      - name: Build Angular app
        working-directory: Rent_Vehicle_UI
        run: npm run build -- --configuration production

      - name: Show build output
        run: find Rent_Vehicle_UI/dist -type f

      - name: Prepare deploy folder
        run: |
          BROWSER_DIR=$(find Rent_Vehicle_UI/dist -type d -name browser | head -n 1)
          echo "Browser dir: $BROWSER_DIR"

          mkdir -p deploy
          cp -r "$BROWSER_DIR/"* deploy/

          # ✅ Ensure index.html exists (handles both cases)
          if [ -f "$BROWSER_DIR/index.html" ]; then
            echo "index.html exists"
          elif [ -f "$BROWSER_DIR/index.csr.html" ]; then
            cp "$BROWSER_DIR/index.csr.html" deploy/index.html
            echo "Renamed index.csr.html → index.html"
          else
            echo "❌ No index file found!" && exit 1
          fi

          # ✅ Proper .htaccess (NO indentation)
          cat > deploy/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          </IfModule>
          EOF

          echo "Deploy folder contents:"
          ls -la deploy

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps   # ✅ use FTPS
          local-dir: deploy/
          server-dir: /htdocs/
          dangerous-clean-slate: true
